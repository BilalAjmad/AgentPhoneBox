name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Verify binaries
        run: |
          ./target/release/MobileBox.exe --version || true
          ./target/release/mobilebox-mcp.exe --help || true

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      - name: Create distribution package
        run: |
          mkdir dist
          cp target/release/MobileBox.exe dist/
          cp target/release/mobilebox-mcp.exe dist/
          cp MobileBox.ico dist/
          cp MobileBox-Hotkey.ps1 dist/
          cp MobileBox-Settings.ps1 dist/
          cp scripts/setup.ps1 dist/
          cp scripts/setup.sh dist/
          cp -r skins dist/
          cp README.md dist/
          cp LICENSE dist/
          cp -r docs dist/

      - name: Create zip
        run: |
          7z a MobileBox-${{ github.ref_name }}-windows.zip dist/*

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: MobileBox-*.zip
          draft: false
          prerelease: false

